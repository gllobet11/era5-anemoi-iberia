# Dominio, variables y periodo del proyecto (D-001)
name: iberia
area: [45, -10, 35, 5]        # N, W, S, E (orden CDS)
grid: [0.25, 0.25]
period:
  start: "2020-01-01"
  end: "2022-12-31"
frequency: 6h

single_levels:
  dataset: reanalysis-era5-single-levels
  # tp es acumulada: se descarga horaria para sumar a 6 h en F2 (D-008)
  hours: all
  variables:
    2t: 2m_temperature
    10u: 10m_u_component_of_wind
    10v: 10m_v_component_of_wind
    msl: mean_sea_level_pressure
    tp: total_precipitation
    sp: surface_pressure

pressure_levels:
  dataset: reanalysis-era5-pressure-levels
  hours: ["00:00", "06:00", "12:00", "18:00"]
  levels: [500, 850]
  variables:
    t: temperature
    z: geopotential

chunks:
  time: 124        # ~1 mes a 6 h
  latitude: -1
  longitude: -1

paths:
  raw: data/raw
  interim: data/interim
  zarr: data/zarr/iberia.zarr

ingest:
  netcdf_month: "2020-01"   # único mes también en NetCDF, para comparar formatos (D-002)
  retries: 3
  backoff_s: 60             # espera = backoff_s * 2**intento
  workers: 4                # peticiones simultáneas al CDS (la cola es el cuello de botella)

qc:
  reports: reports
  max_nan_pct: 0.0            # % NaN tolerado por variable, tras la exención de abajo
  leading_nan_steps:          # pasos iniciales en los que NaN es esperado
    tp: 1                     # 2020-01-01 00 UTC necesita horas de dic-2019 (D-010)
  ranges:                     # [min, max] plausibles para Iberia, unidades nativas ERA5 (D-010)
    t2m: [230, 330]           # K
    u10: [-50, 50]            # m s-1
    v10: [-50, 50]
    msl: [94000, 106000]      # Pa
    sp: [60000, 106000]       # Pa (orografía ERA5 hasta ~2500 m)
    tp: [0, 0.3]              # m en 6 h
    t: [180, 320]             # K, 500 y 850 hPa
    z: [5000, 65000]          # m2 s-2, 850 hPa ~1,5 km y 500 hPa ~5,5 km
